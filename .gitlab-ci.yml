# CI/CD GitLab (forge interne) : tests à chaque push, livraison sur tag.
image: node:22

variables:
  PNPM_HOME: /root/.local/share/pnpm
  POSTGRES_USER: rni
  POSTGRES_PASSWORD: rni
  POSTGRES_DB: postgres
  PG_HOST: postgres

stages: [test, build, deploy]

.pnpm: &pnpm
  before_script:
    - corepack enable && corepack prepare pnpm@10.28.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]

test:
  <<: *pnpm
  stage: test
  services: [postgres:16]
  script:
    - pnpm audit --prod --audit-level high
    - pnpm typecheck
    - pnpm test
    - pnpm test:e2e

build:
  <<: *pnpm
  stage: build
  only: [tags]
  script:
    - pnpm release
  artifacts:
    paths: [release/]
    expire_in: 1 week

deploy:
  stage: deploy
  only: [tags]
  when: manual
  image: alpine:3.20
  before_script:
    - apk add --no-cache rsync openssh-client
    - eval $(ssh-agent -s) && echo "$DEPLOY_SSH_KEY" | ssh-add -
  script:
    - rsync -a -e "ssh -o StrictHostKeyChecking=accept-new" release/ deploy/ "$DEPLOY_USER@$DEPLOY_HOST:/tmp/rni-release/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /tmp/rni-release/install.sh /tmp/rni-release"
