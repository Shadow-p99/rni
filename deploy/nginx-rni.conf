# Nginx — client RNI (/srv/nginx/rni) et API (/rni/api → pm2 rni-api:8096).
# L'authentification est assurée en amont par le SSO, qui injecte les en-têtes nigend, cn, title,
# codeunite, lib_region… Ces en-têtes ne doivent JAMAIS pouvoir être fournis par le navigateur :
# le reverse-proxy SSO doit les écraser systématiquement.
location /rni/ {
    alias /srv/nginx/rni/;
    try_files $uri $uri/ /rni/index.html;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy same-origin;
}

location ~* ^/rni/.*\.(js|css|woff2?|svg|png)$ {
    root /srv/nginx;
    expires 30d;
    access_log off;
}

location = /rni/index.html {
    alias /srv/nginx/rni/index.html;
    add_header Cache-Control "no-store";
}

location /rni/api/ {
    proxy_pass http://127.0.0.1:8096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}
