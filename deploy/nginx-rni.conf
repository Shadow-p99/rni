# Nginx — client RNI (/srv/nginx/rni/current) et API (/rni/api → rni-api:8096, service systemd).
# L'authentification est assurée en amont par le SSO, qui injecte les en-têtes nigend, cn, title,
# codeunite, lib_region… Ces en-têtes ne doivent JAMAIS pouvoir être fournis par le navigateur :
# le reverse-proxy SSO doit les écraser systématiquement.
#
# À inclure dans le bloc `server` (TLS) du site. Le bloc `upstream` va dans le contexte `http` :
#
#   upstream rni_api {
#       server 127.0.0.1:8096;
#       keepalive 32;               # connexions réutilisées vers l'API (cf. keepAliveTimeout 65 s)
#   }
#
# Secret partagé avec l'API (PROXY_SHARED_SECRET dans /etc/rni/rni-api.env), dans un fichier
# lisible par root uniquement, inclus ici :
#   /etc/nginx/rni-proxy-secret.conf :  proxy_set_header X-RNI-Proxy-Secret "<secret>";
#
# Matomo (si rni.matomo.url est paramétré) : ajouter son origine à script-src, img-src et connect-src.

set $rni_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

location /rni/ {
    alias /srv/nginx/rni/current/;
    try_files $uri $uri/ /rni/index.html;
    add_header Content-Security-Policy $rni_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
}

location ~* ^/rni/(?!api/).*\.(js|css|woff2?|svg|png|ico)$ {
    root /srv/nginx/rni/current;
    rewrite ^/rni/(.*)$ /$1 break;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}

location = /rni/index.html {
    alias /srv/nginx/rni/current/index.html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $rni_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
}

location /rni/api/ {
    # Compression des réponses JSON (calendrier national : ~15 Mo → ~1 Mo). Les réponses mises en
    # cache par l'API portent un ETag : un client à jour reçoit 304 sans corps.
    gzip on;
    gzip_proxied any;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 4;

    proxy_pass http://rni_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/rni-proxy-secret.conf;
    # Redémarrage progressif : une requête idempotente sur une connexion fermée est rejouée
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
}
