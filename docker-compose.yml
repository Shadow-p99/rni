# PostgreSQL de développement, initialisé avec le schéma, les référentiels et le jeu de données fictif.
#   pnpm db:up      → démarre la base seule (port 5432, rni / rni)
#   pnpm db:reset   → recrée la base depuis les scripts
# Application complète conteneurisée (base + API + client Nginx) :
#   pnpm docker:up  → http://localhost:8080/rni/  (authentification simulée, services externes simulés)
#   docker compose --profile tools run --rm migrate   → applique db/migrations (historique t_schema_migrations)
services:
  db:
    image: postgres:16
    container_name: rni-db
    environment:
      POSTGRES_USER: rni
      POSTGRES_PASSWORD: rni
      POSTGRES_DB: rni
      TZ: Europe/Paris
    ports:
      - '5432:5432'
    volumes:
      - rni-pgdata:/var/lib/postgresql/data
      - ./apps/api/db/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./apps/api/db/init/02-referentiels.sql:/docker-entrypoint-initdb.d/02-referentiels.sql:ro
      - ./apps/api/db/init/03-param-app.sql:/docker-entrypoint-initdb.d/03-param-app.sql:ro
      - ./apps/api/db/dev/90-seed-dev.sql:/docker-entrypoint-initdb.d/90-seed-dev.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rni -d rni']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: rni-api
    container_name: rni-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Démonstration locale : l'authentification simulée n'est autorisée qu'en development.
      # En préproduction / production : NODE_ENV=production, RNI_MOCK_AUTH=false, RNI_MOCK_EXTERNAL=false
      NODE_ENV: development
      # Primaire + 2 workers : comportement de production (cluster, invalidation partagée du cache)
      WEB_CONCURRENCY: 2
      MIGRATE_ON_START: 'true'
      PROXY_SHARED_SECRET: ${RNI_PROXY_SECRET:-dev-proxy-secret-change-me}
      RNI_MOCK_AUTH: 'true'
      RNI_MOCK_EXTERNAL: 'true'
      MOCK_NIGEND: '100001'
      CORS_ORIGINS: http://localhost:8080
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: rni
      PG_PASSWORD: rni
      PG_DATABASE: rni
    expose:
      - '8096'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: rni-web
    container_name: rni-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:8096
      PROXY_SHARED_SECRET: ${RNI_PROXY_SECRET:-dev-proxy-secret-change-me}
    ports:
      - '8080:8080'

  # Migrations versionnées (base existante) : docker compose --profile tools run --rm migrate
  migrate:
    image: rni-api
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PG_HOST: db
      PG_USER: rni
      PG_PASSWORD: rni
      PG_DATABASE: rni
    command: ['node', 'dist/migrate.js']

volumes:
  rni-pgdata:
